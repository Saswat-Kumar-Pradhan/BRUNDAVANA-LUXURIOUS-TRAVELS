<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D98B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A8851F"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Crown / Luxury Crest Crest Mark -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield / Ring -->
    <circle cx="32" cy="32" r="30" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" opacity="0.9"/>
    <circle cx="32" cy="32" r="26" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.6"/>

    <!-- Steering Wheel & Wing Emblem -->
    <path d="M18 32 C18 24.268 24.268 18 32 18 C39.732 18 46 24.268 46 32 C46 39.732 39.732 46 32 46 C24.268 46 18 39.732 18 32 Z" 
          stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
    <circle cx="32" cy="32" r="6" fill="url(#goldGrad)"/>
    <path d="M20 32 L26 32 M38 32 L44 32 M32 38 L32 44" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Car Crown Accent Top -->
    <path d="M22 14 L27 18 L32 11 L37 18 L42 14 L39 21 L25 21 Z" fill="url(#goldGrad)"/>

    <!-- Star Jewels -->
    <polygon points="32,4 33.5,8 37,8.5 34.5,11 35.5,14.5 32,12.5 28.5,14.5 29.5,11 27,8.5 30.5,8" fill="url(#goldGrad)"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(85, 20)">
    <text x="0" y="24" font-family="'Playfair Display', Georgia, serif" font-size="21" font-weight="800" letter-spacing="3" fill="url(#goldGrad)">
      BRUNDAVANA
    </text>
    <text x="0" y="42" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="9" font-weight="600" letter-spacing="5" fill="#C5A03A" opacity="0.95">
      LUXURIOUS TRAVELS
    </text>
  </g>
</svg>
